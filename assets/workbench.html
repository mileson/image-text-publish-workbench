<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图文发布工作台</title>
<style>
:root{--ink:#222;--muted:#999;--red:#ff2442;--line:#eee;--footer:calc(106px + env(safe-area-inset-bottom))}*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:rgba(160,160,160,.32) transparent}*::-webkit-scrollbar{width:4px;height:4px}*::-webkit-scrollbar-thumb{background:rgba(160,160,160,.32);border-radius:99px}body{margin:0;background:white;color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;height:100dvh;overflow:hidden}button,input,textarea{font:inherit}button{border:0;cursor:pointer;background:#f5f5f5;color:#333;border-radius:24px;padding:7px 11px}button:hover{background:#eee}button:disabled{opacity:.45;cursor:wait}button:focus-visible{outline:2px solid var(--red);outline-offset:3px}input,textarea{color:var(--ink)}.layout{display:grid;grid-template-columns:minmax(0,.88fr) minmax(0,1.12fr);gap:clamp(18px,2.4vw,44px);height:calc(100dvh - var(--footer));padding:22px clamp(14px,2.2vw,40px) 12px}.assets,.editor,.editor>*{min-width:0;min-height:0}.assets{display:flex;flex-direction:column;gap:12px}.preview-stage{position:relative;min-height:120px;flex:1;display:flex;align-items:center;justify-content:center;background:#fff;overflow:hidden;border-radius:10px}.preview-stage img{width:100%;height:100%;object-fit:contain;border-radius:10px}.preview-stage img[hidden]{display:none}.empty-preview{color:#aaa;align-self:center;text-align:center}.asset-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;min-height:30px}.asset-tools button{font-size:11px}.asset-tools span{font-size:11px;color:#999}.tool-buttons{display:flex;gap:5px;flex-wrap:wrap}.thumbs{display:flex;gap:12px;min-width:0;align-items:flex-start}.cover-thumbs{display:flex;flex:0 0 auto;max-width:60%;gap:9px;overflow-x:auto;padding:2px 0 8px}.photo-thumbs{display:flex;flex:1 1 0;min-width:0;gap:9px;overflow-x:auto;padding:2px 0 8px}.thumb{flex:0 0 54px;border:2px solid transparent;border-radius:9px;padding:3px;position:relative;background:transparent;min-height:69px}.thumb img{width:44px;height:59px;object-fit:cover;display:block;border-radius:6px}.thumb .empty-thumb{width:44px;height:59px;display:grid;place-items:center;font-size:20px;color:#bbb;background:#fafafa;border-radius:6px}.thumb span.badge{position:absolute;top:3px;right:3px;background:#0008;color:#fff;font-size:9px;padding:1px 4px;border-radius:0 5px 0 5px}.thumb.active{border-color:var(--red)}.thumb.cover-thumb{background:#fff4f6;border-color:#ffc1cb;border-style:dashed}.thumb.cover-thumb.active{border-color:var(--red);border-style:solid}.thumb.cover-thumb .badge{background:var(--red);font-size:10px}.thumb.dragover,.preview-stage.dragover{outline:2px dashed var(--red);outline-offset:-2px}.editor{display:grid;grid-template-rows:auto auto minmax(87px,.6fr) auto;gap:12px;align-content:start;overflow-y:auto}h2{font-size:15px;font-weight:500;margin:0 0 10px}.titles{display:flex;gap:8px;overflow-x:auto;padding-bottom:7px;min-width:0}.title-card{flex:0 0 175px;min-width:0;min-height:72px;padding:9.6px 12px;display:flex;flex-direction:column;gap:8px;border:1px solid #eee;border-radius:10px;cursor:pointer}.title-card.active{border-color:var(--red)}.title-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.title-choice{padding:0;background:none;border-radius:0;font-size:10px;color:#999;white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}.active .title-choice{color:var(--red)}.title-count{display:inline-flex;align-items:center;justify-content:center;flex:0 0 43.4px;height:16.8px;padding:0 5.6px;border-radius:99px;font-size:7px;color:#333;white-space:nowrap;background:linear-gradient(to right,#cfe7ff 0%,#cfe7ff var(--used,0%),#edf5fd var(--used,0%),#edf5fd 100%)}.title-count.over{color:white;background:var(--red)}.title-edit{width:100%;min-width:0;padding:3px 0;border:0;border-bottom:1px solid transparent;border-radius:0;background:none;font-size:11.2px;font-weight:500;outline:none}.title-edit:focus{border-bottom-color:var(--red)}.body-heading,.tags-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.body-heading h2,.tags-head h2{margin:0}.meter{font-size:11px;color:#999;white-space:nowrap;padding:5px 8px;border-radius:20px;background:#f7f7f7}.meter.over{background:#fff0f2;color:var(--red)}.body-options{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px}.body-options button{white-space:nowrap;font-size:11px;padding:6px 11px}.body-options button.active{background:#fff0f2;color:var(--red)}.body-area{min-height:0;display:flex}textarea#bodyInput{min-height:87px;flex:1;width:100%;resize:none;overflow:auto;background:#f7f7f7;border:0;outline:0;border-radius:12px;padding:12px 14px;line-height:1.85;font-size:10.8px}.tags-area{padding:10px 0;border-top:1px solid #eee}.tags{display:flex;gap:6px;flex-wrap:wrap;max-height:115px;overflow:auto}.tag{font-size:8.8px;padding:5.6px 9.6px;background:#fff0f2;color:var(--red)}.tag.off{background:transparent;color:#bbb;text-decoration:line-through}.footer{position:fixed;left:0;right:0;bottom:0;z-index:5;background:white;border-top:1px solid #eee;padding:10px 14px calc(10px + env(safe-area-inset-bottom));min-height:var(--footer)}.copy-group{display:grid;grid-template-columns:auto auto;justify-content:center;column-gap:48px;row-gap:8px}.copy-btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:5px 0;border-radius:0;background:none;font-size:12px}.copy-btn.primary{grid-column:1/-1;grid-row:1;justify-self:center;background:var(--red);color:#fff;border-radius:99px;padding:11px 28px;min-width:265px}.copy-btn.primary:hover{background:#e91836}.copy-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.copy-btn svg .icon-eye{fill:currentColor;stroke:none}.draft-tools{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:5px;font-size:10px;min-height:17px}.draft-tools button{font-size:10px;background:none;padding:0;color:#888;border-radius:0}.save-status{color:#999}.save-status.warning{color:#987526}.toast{position:fixed;bottom:calc(var(--footer) + 14px);left:50%;transform:translate(-50%,15px);opacity:0;pointer-events:none;z-index:20;background:#2f9d6a;color:white;padding:10px 18px;border-radius:10px;box-shadow:0 8px 30px #234e2430;transition:.2s;font-size:13px;max-width:calc(100vw - 24px);width:max-content}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.warning{background:#fff3c4;color:#735b22}dialog{max-width:600px;width:90vw;border:0;border-radius:16px;background:white;padding:22px}dialog::backdrop{background:#10251d88}dialog textarea{width:100%;height:220px}dialog button{float:right;margin-top:12px}.hidden{display:none!important}
@media(max-width:980px){body{height:auto;min-height:100dvh;overflow:auto;padding-bottom:calc(var(--footer) + 14px)}.layout{height:auto;grid-template-columns:minmax(0,1fr);gap:22px;padding:18px 20px}.preview-stage{height:clamp(320px,55vw,560px);flex:none}.editor{display:flex;flex-direction:column;overflow:visible}.body-area{height:252px}.tags{max-height:160px}.cover-thumbs{max-width:44%}}
@media(max-width:720px){.layout{padding:16px 14px}.preview-stage{height:clamp(280px,80vw,420px)}.body-area{height:234px}.title-card{flex-basis:175px}.cover-thumbs{gap:5px;max-width:60%}.photo-thumbs{gap:5px}.thumbs{gap:8px}.copy-group{column-gap:40px}.copy-btn.primary{padding:11px 24px}.asset-tools{gap:5px}}
@media(max-width:380px){.thumb{flex-basis:46px;padding:2px;min-height:59px}.thumb img,.thumb .empty-thumb{width:38px;height:51px}.cover-thumbs,.photo-thumbs{gap:4px}.draft-tools{gap:7px}}
</style></head><body>
<main class="layout" aria-label="图文发布工作台"><section class="assets"><div class="preview-stage" id="previewStage"><img id="hero" alt="当前图片预览" hidden><div id="emptyPreview" class="empty-preview">选择一张封面开始预览</div></div><div class="asset-tools"><span id="assetCaption"></span><div class="tool-buttons"><button id="replaceAsset">选择图片</button><button id="restoreAsset" hidden>恢复原图</button><button id="removeAsset" hidden>移除</button><button id="movePrevious" hidden aria-label="内页前移">←</button><button id="moveNext" hidden aria-label="内页后移">→</button><button id="addPhoto">添加内页</button></div></div><div class="thumbs" id="thumbs" aria-label="封面候选与内页"><div class="cover-thumbs" id="coverThumbs" aria-label="可选封面"></div><div class="photo-thumbs" id="photoThumbs" aria-label="内页图片，可横向滚动"></div></div><input id="assetInput" type="file" accept="image/jpeg,image/png,image/webp" hidden><input id="photosInput" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden></section>
<section class="editor"><div><h2>标题</h2><div class="titles" id="titles" aria-label="标题候选"></div></div><div><div class="body-heading"><h2>正文</h2><span class="meter" id="bodyCount" aria-live="polite"></span></div><div class="body-options" id="bodyOptions" aria-label="正文选项"></div></div><div class="body-area"><textarea id="bodyInput" aria-label="发布正文" placeholder="添加正文" spellcheck="false"></textarea></div><div class="tags-area"><div class="tags-head"><h2>话题</h2><span class="meter" id="tagMeter"></span></div><div class="tags" id="tags"></div></div></section></main>
<div class="footer"><div class="copy-group"><button class="copy-btn" id="copyTitle"><span>复制标题</span></button><button class="copy-btn" id="copyBody"><span>复制正文与话题</span></button><button class="copy-btn primary" id="copyAI"><span>复制发布信息给 AI</span></button></div><div class="draft-tools hidden" hidden aria-hidden="true"><span id="saveStatus" class="save-status" role="status">正在读取草稿…</span><button id="exportSelection">导出发布信息</button><button id="exportDraft">导出草稿</button><button id="importDraft">导入草稿</button></div></div>
<input id="draftInput" type="file" accept="application/json,.json" hidden><div id="toast" class="toast" role="status" aria-live="polite"></div><dialog id="copyDialog"><h3>复制这段内容</h3><p>自动复制未完成，请选中后复制。</p><textarea id="manualCopy" aria-label="手动复制内容"></textarea><button id="closeCopy">关闭</button></dialog>
<script>const DATA=__DATA__;</script><script>__CORE__</script><script>__APP__</script></body></html>
