<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img"><title>Choose before you publish / 先选好，再交接</title><rect width="1200" height="640" rx="28" fill="#f2f7fc"/><text x="56" y="70" font-family="sans-serif" font-size="32" font-weight="700" fill="#1d3551">Choose before you publish / 先选好，再交接</text><text x="56" y="109" font-family="sans-serif" font-size="18" fill="#5c6c7f">Workflow diagram • illustrative, not a browser screenshot / 流程示意</text><rect x="56" y="160" width="338" height="170" rx="18" fill="white" stroke="#cedceb"/><circle cx="88" cy="192" r="17" fill="#e62323"/><text x="88" y="198" text-anchor="middle" font-family="sans-serif" font-size="17" fill="white">1</text><text x="116" y="199" font-family="sans-serif" font-size="21" font-weight="700" fill="#1d3551">Prepare / 准备</text><text x="80" y="246" font-family="sans-serif" font-size="17" fill="#51657b">Existing pictures + draft copy</text><text x="80" y="278" font-family="sans-serif" font-size="17" fill="#51657b">AI creates structured candidates</text><text x="80" y="310" font-family="sans-serif" font-size="17" fill="#51657b">No invented images or results</text><rect x="430" y="160" width="338" height="170" rx="18" fill="white" stroke="#cedceb"/><circle cx="462" cy="192" r="17" fill="#e62323"/><text x="462" y="198" text-anchor="middle" font-family="sans-serif" font-size="17" fill="white">2</text><text x="490" y="199" font-family="sans-serif" font-size="21" font-weight="700" fill="#1d3551">Review / 评审</text><text x="454" y="246" font-family="sans-serif" font-size="17" fill="#51657b">Choose cover and page order</text><text x="454" y="278" font-family="sans-serif" font-size="17" fill="#51657b">Edit title and body separately</text><text x="454" y="310" font-family="sans-serif" font-size="17" fill="#51657b">Toggle relevant tags</text><rect x="804" y="160" width="338" height="170" rx="18" fill="white" stroke="#cedceb"/><circle cx="836" cy="192" r="17" fill="#e62323"/><text x="836" y="198" text-anchor="middle" font-family="sans-serif" font-size="17" fill="white">3</text><text x="864" y="199" font-family="sans-serif" font-size="21" font-weight="700" fill="#1d3551">Hand off / 交接</text><text x="828" y="246" font-family="sans-serif" font-size="17" fill="#51657b">Copy current selected package</text><text x="828" y="278" font-family="sans-serif" font-size="17" fill="#51657b">Verify uploaded originals</text><text x="828" y="310" font-family="sans-serif" font-size="17" fill="#51657b">Publish only with authorization</text><rect x="56" y="360" width="1086" height="170" rx="18" fill="white" stroke="#cedceb"/><circle cx="88" cy="392" r="17" fill="#e62323"/><text x="88" y="398" text-anchor="middle" font-family="sans-serif" font-size="17" fill="white">✓</text><text x="116" y="399" font-family="sans-serif" font-size="21" font-weight="700" fill="#1d3551">Keep the user in control / 最后由人来选择</text><text x="80" y="446" font-family="sans-serif" font-size="17" fill="#51657b">Source files stay unchanged; selected uploads are fingerprinted.</text><text x="80" y="478" font-family="sans-serif" font-size="17" fill="#51657b">Local draft recovery depends on browser storage. Keep a backup.</text><text x="80" y="510" font-family="sans-serif" font-size="17" fill="#51657b">Generated HTML includes your materials: sanitize before public sharing.</text><text x="56" y="605" font-family="sans-serif" font-size="18" fill="#52687d">Input → validation → local HTML → reviewed selection → verified files</text></svg>