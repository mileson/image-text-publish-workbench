<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img"><title>One page, separate choices / 一个页面，独立选择</title><rect width="1200" height="640" rx="28" fill="#f2f7fc"/><text x="56" y="70" font-family="sans-serif" font-size="32" font-weight="700" fill="#1d3551">One page, separate choices / 一个页面，独立选择</text><text x="56" y="109" font-family="sans-serif" font-size="18" fill="#5c6c7f">Area map • illustrative, not a browser screenshot / 区域与操作示意</text><rect x="56" y="150" width="520" height="175" rx="18" fill="white" stroke="#cedceb"/><circle cx="88" cy="182" r="17" fill="#e62323"/><text x="88" y="188" text-anchor="middle" font-family="sans-serif" font-size="17" fill="white">1</text><text x="116" y="189" font-family="sans-serif" font-size="21" font-weight="700" fill="#1d3551">Image preview / 图片预览</text><text x="80" y="236" font-family="sans-serif" font-size="17" fill="#51657b">Large preview keeps aspect ratio</text><text x="80" y="268" font-family="sans-serif" font-size="17" fill="#51657b">Cover candidates stay in front</text><text x="80" y="300" font-family="sans-serif" font-size="17" fill="#51657b">Inner pages have their own order</text><rect x="610" y="150" width="532" height="175" rx="18" fill="white" stroke="#cedceb"/><circle cx="642" cy="182" r="17" fill="#e62323"/><text x="642" y="188" text-anchor="middle" font-family="sans-serif" font-size="17" fill="white">2</text><text x="670" y="189" font-family="sans-serif" font-size="21" font-weight="700" fill="#1d3551">Title candidates / 标题候选</text><text x="634" y="236" font-family="sans-serif" font-size="17" fill="#51657b">Click to choose; edit directly</text><text x="634" y="268" font-family="sans-serif" font-size="17" fill="#51657b">Character count follows settings</text><text x="634" y="300" font-family="sans-serif" font-size="17" fill="#51657b">Title does not lock body choice</text><rect x="56" y="355" width="520" height="175" rx="18" fill="white" stroke="#cedceb"/><circle cx="88" cy="387" r="17" fill="#e62323"/><text x="88" y="393" text-anchor="middle" font-family="sans-serif" font-size="17" fill="white">3</text><text x="116" y="394" font-family="sans-serif" font-size="21" font-weight="700" fill="#1d3551">Body and tags / 正文与话题</text><text x="80" y="441" font-family="sans-serif" font-size="17" fill="#51657b">Switch independently saved drafts</text><text x="80" y="473" font-family="sans-serif" font-size="17" fill="#51657b">Selected tags appear first</text><text x="80" y="505" font-family="sans-serif" font-size="17" fill="#51657b">Current content is what gets copied</text><rect x="610" y="355" width="532" height="175" rx="18" fill="white" stroke="#cedceb"/><circle cx="642" cy="387" r="17" fill="#e62323"/><text x="642" y="393" text-anchor="middle" font-family="sans-serif" font-size="17" fill="white">4</text><text x="670" y="394" font-family="sans-serif" font-size="21" font-weight="700" fill="#1d3551">Copy and handoff / 复制与交接</text><text x="634" y="441" font-family="sans-serif" font-size="17" fill="#51657b">Copy package / title / body + tags</text><text x="634" y="473" font-family="sans-serif" font-size="17" fill="#51657b">Missing images block full handoff</text><text x="634" y="505" font-family="sans-serif" font-size="17" fill="#51657b">Uploads materialize into new files</text><text x="56" y="605" font-family="sans-serif" font-size="18" fill="#52687d">Not shown: automatic platform posting. This workbench prepares the reviewed package.</text></svg>